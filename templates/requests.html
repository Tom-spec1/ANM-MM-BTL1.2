<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Certificate Requests</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h2>Certificate Requests</h2><table class="table table-striped"><thead><tr><th>ID</th><th>CN</th><th>Subject</th><th>Status</th><th>Submitted</th><th>Processed</th><th></th></tr></thead><tbody>{% for item in requests %}<tr><td>{{ item.request_id }}</td><td>{{ item.common_name }}</td><td>{{ item.subject }}</td><td>{{ item.status }}</td><td>{{ item.submitted_at }}</td><td>{{ item.processed_at or "--" }}</td><td><a href="{{ url_for('request_details',request_id=item.request_id) }}">View</a></td></tr>{% endfor %}</tbody></table></main></body></html>
