<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Certificates</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h2>{{ page_title }}</h2><table class="table table-striped"><thead><tr><th>Serial</th><th>Subject</th><th>Not Before</th><th>Not After</th><th>Status</th></tr></thead><tbody>{% for cert in certificates %}<tr><td><a href="{{ url_for('certificate_details',serial_number=cert.serial_number) }}">{{ cert.serial_number }}</a></td><td>{{ cert.subject }}</td><td>{{ cert.not_before }}</td><td>{{ cert.not_after }}</td><td>{{ cert.status }}</td></tr>{% endfor %}</tbody></table></main></body></html>
