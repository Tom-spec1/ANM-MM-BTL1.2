<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Request Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/requests">← Requests</a><h2>Request #{{ certificate_request.request_id }}</h2><p><b>CN:</b> {{ certificate_request.common_name }}</p><p><b>Subject:</b> {{ certificate_request.subject }}</p><p><b>Status:</b> {{ certificate_request.status }}</p>{% if certificate_request.status == "PENDING" %}<form method="post" action="{{ url_for('approve_certificate_request',request_id=certificate_request.request_id) }}" class="mb-3"><button class="btn btn-success">Approve</button></form><form method="post" action="{{ url_for('reject_certificate_request',request_id=certificate_request.request_id) }}"><textarea name="reason" class="form-control mb-2" required placeholder="Rejection reason"></textarea><button class="btn btn-danger">Reject</button></form>{% endif %}<h5 class="mt-4">CSR</h5><pre class="bg-dark text-light p-3">{{ certificate_request.csr_pem }}</pre></main></body></html>
